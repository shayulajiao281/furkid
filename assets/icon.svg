<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A6B"/>
      <stop offset="100%" stop-color="#FF6B8A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角方块 -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- 爪印 -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- 左脚趾 -->
    <ellipse cx="320" cy="380" rx="72" ry="88" transform="rotate(-20 320 380)"/>
    <!-- 中左脚趾 -->
    <ellipse cx="455" cy="290" rx="72" ry="95" transform="rotate(-7 455 290)"/>
    <!-- 中右脚趾 -->
    <ellipse cx="590" cy="290" rx="72" ry="95" transform="rotate(7 590 290)"/>
    <!-- 右脚趾 -->
    <ellipse cx="720" cy="380" rx="72" ry="88" transform="rotate(20 720 380)"/>

    <!-- 脚掌 -->
    <path d="M 512 470
             C 620 470, 720 550, 720 660
             C 720 760, 640 810, 512 810
             C 384 810, 304 760, 304 660
             C 304 550, 404 470, 512 470 Z"/>
  </g>

  <!-- 装饰小心心 -->
  <g transform="translate(770 200) scale(0.9)" fill="#FFFFFF" opacity="0.85">
    <path d="M 0 30 C 0 30, -50 -10, -50 -35 C -50 -55, -35 -70, -15 -70 C -5 -70, 0 -62, 0 -62 C 0 -62, 5 -70, 15 -70 C 35 -70, 50 -55, 50 -35 C 50 -10, 0 30, 0 30 Z" transform="translate(0, 40) scale(0.55)"/>
  </g>
</svg>