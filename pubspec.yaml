name: furkid
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  flutter_slidable: ^4.0.3
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# ═══════════════════════════════════════════
# App 图标配置（最外层，和 name 同级）
# ═══════════════════════════════════════════
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FF7A59"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true

# ═══════════════════════════════════════════
# 启动画面配置（最外层，和 name 同级）
# ═══════════════════════════════════════════
flutter_native_splash:
  color: "#F4F5F9"
  image: assets/splash.jpeg
  color_dark: "#1E2231"
  image_dark: assets/splash.jpeg

  android_gravity: fill              # ← Android 用 fill（拉伸铺满）
  ios_content_mode: scaleAspectFill  # ← iOS 保留

  android_12:
    image: assets/splash.jpeg
    color: "#F4F5F9"
    icon_background_color: "#FF7A59"
    android_gravity: fill            # ← 也改成 fill
  fullscreen: true